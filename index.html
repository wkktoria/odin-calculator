<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/stylesheet.css" />
    <title>Odin Calculator</title>
  </head>
  <body>
    <h1>Odin Calculator</h1>
    <div class="calculator">
      <h2 class="name">Odulator 1105</h2>
      <div class="display">0</div>
      <div class="buttons">
        <div class="row">
          <button class="button span-two faded" value="clear">AC</button>
          <button class="button faded" value="plus-minus">+/-</button>
          <button class="button color" value="divide">÷</button>
        </div>
        <div class="row">
          <button class="button" value="7">7</button>
          <button class="button" value="8">8</button>
          <button class="button" value="9">9</button>
          <button class="button color" value="multiply">×</button>
        </div>
        <div class="row">
          <button class="button" value="4">4</button>
          <button class="button" value="5">5</button>
          <button class="button" value="6">6</button>
          <button class="button color" value="subtract">-</button>
        </div>
        <div class="row">
          <button class="button" value="1">1</button>
          <button class="button" value="2">2</button>
          <button class="button" value="3">3</button>
          <button class="button color" value="add">+</button>
        </div>
        <div class="row">
          <button class="button" value="0">0</button>
          <button class="button">.</button>
          <button class="button span-two color" value="equal">=</button>
        </div>
      </div>
    </div>
    <footer>
      <p>Made by <a href="https://github.com/wkktoria">@wkktoria</a></p>
    </footer>
    <script src="js/script.js"></script>
  </body>
</html>
